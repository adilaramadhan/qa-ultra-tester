name: QA Ultra Tester - E2E Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1-5'  # Weekdays at 8am
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to test'
        required: true
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - smoke
          - regression
          - security
          - accessibility

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          npm ci
          pip install playwright pytest pytest-playwright openpyxl python-docx pillow
          npx playwright install --with-deps chromium firefox webkit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  ui-testing:
    name: UI/UX Testing
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run UI Tests
        run: |
          npx playwright test tests/ui/ --reporter=html,json
        env:
          BASE_URL: ${{ github.event.inputs.target_url || secrets.BASE_URL }}

      - name: Upload UI Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            test-results/
            playwright-report/

  api-testing:
    name: API Validation
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run API Tests
        run: |
          npx playwright test tests/api/ --reporter=html,json
        env:
          BASE_URL: ${{ github.event.inputs.target_url || secrets.BASE_URL }}

      - name: Upload API Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: test-results/

  accessibility-testing:
    name: Accessibility Audit (WCAG)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Accessibility Tests
        run: |
          npx playwright test tests/accessibility/ --reporter=html,json
        env:
          BASE_URL: ${{ github.event.inputs.target_url || secrets.BASE_URL }}

      - name: Upload Accessibility Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: test-results/

  security-testing:
    name: Security Testing
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Security Tests
        run: |
          npx playwright test tests/security/ --reporter=html,json
        env:
          BASE_URL: ${{ github.event.inputs.target_url || secrets.BASE_URL }}

      - name: Upload Security Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: test-results/

  performance-testing:
    name: Performance Budget
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ github.event.inputs.target_url || secrets.BASE_URL }}
          uploadArtifacts: true

      - name: Run Performance Tests
        run: |
          npx playwright test tests/performance/ --reporter=html,json
        env:
          BASE_URL: ${{ github.event.inputs.target_url || secrets.BASE_URL }}

  report:
    name: Generate Report
    needs: [ui-testing, api-testing, accessibility-testing, security-testing, performance-testing]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate Combined Report
        run: |
          python scripts/generate_report.py
          python scripts/performance_analyzer.py
          python scripts/accessibility_checker.py

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-report
          path: hasil-test/

      - name: Publish Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: hasil-test/
          destination_dir: qa-reports/${{ github.run_number }}

  notify:
    name: Send Notifications
    needs: report
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "QA Ultra Test Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*QA Test Results*\nStatus: ${{ job.status }}\nReport: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
